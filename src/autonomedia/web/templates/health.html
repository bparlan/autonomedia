<!DOCTYPE html>
<html>
<head>
    <title>Infrastructure Health Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .status-healthy {
            color: green;
            font-weight: bold;
        }
        .status-unhealthy {
            color: red;
            font-weight: bold;
        }
        .health-dashboard {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div id="health-dashboard" class="health-dashboard">
        <h1>Infrastructure Health Dashboard</h1>
        <p id="loading">Loading health status...</p>
        <p id="error" style="color: red; display: none;"></p>
        <div id="status-container" style="display: none;">
            <h2>System Status</h2>
            <ul>
                <li>Database: <span id="status-database" class="status-healthy"></span></li>
                <li>Runtime: <span id="status-runtime" class="status-healthy"></span></li>
                <li>Tests: <span id="status-tests" class="status-healthy"></span></li>
                <li>Source: <span id="status-src" class="status-healthy"></span></li>
            </ul>
        </div>
    </div>

    <script>
        fetch('/api/health')
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                if (data.error) {
                    document.getElementById('error').textContent = 'Error: ' + data.error;
                    document.getElementById('error').style.display = 'block';
                } else {
                    document.getElementById('status-container').style.display = 'block';
                    document.getElementById('status-database').textContent = data.database || 'N/A';
                    document.getElementById('status-runtime').textContent = data.runtime || 'N/A';
                    document.getElementById('status-tests').textContent = data.tests || 'N/A';
                    document.getElementById('status-src').textContent = data.src || 'N/A';

                    // Update classes based on status
                    ['database', 'runtime', 'tests', 'src'].forEach(key => {
                        const element = document.getElementById('status-' + key);
                        const status = data[key];
                        element.className = status === 'healthy' ? 'status-healthy' : 'status-unhealthy';
                    });
                }
            })
            .catch(e => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = 'Error: ' + e.message;
                document.getElementById('error').style.display = 'block';
            });
    </script>
</body>
</html>
