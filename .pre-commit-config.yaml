repos:
  - repo: local
    hooks:
      - id: check-for-sensitive-files
        name: Check for sensitive runtime artifacts
        entry: bash -c 'git diff --cached --name-only | grep -E "^(runtime/|browser_data/|\.env|.*\.db|.*\.cache)" && exit 1 || exit 0'
        language: system
        pass_filenames: false
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.6.5
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
